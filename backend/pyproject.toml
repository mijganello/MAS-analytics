[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-analytics"
version = "0.1.0"
description = "Multi-Agent System for Controlled LLM-based Analytical Reporting"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # LLM & structured output
    "instructor>=1.4",
    "openai>=1.40",
    "ollama>=0.3",
    # Pydantic
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Document processing
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "chardet>=5.2",
    # Math & analytics
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    # NLP
    "vaderSentiment>=3.3",
    "nltk>=3.8",
    # Vector store & DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "rank-bm25>=0.2",
    # Caching & messaging
    "redis[asyncio]>=5.0",
    # Observability
    "structlog>=24.2",
    "httpx>=0.27",
    "aiofiles>=23.2",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
